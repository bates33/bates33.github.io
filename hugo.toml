baseURL = "https://blog.bybates.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "Bates' Blog"
theme = "PaperMod"
[pagination]
pagerSize = 10
enableRobotsTXT = true
hasCJKLanguage = true

[params]
env = "production"
defaultTheme = "light"
disableThemeToggle = true
ShowReadingTime = true
ShowWordCount = true
ShowLastMod = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = true
comments = false
images = [""]
DateFormat = "2006-01-02"

  [params.label]
  text = "Bates' Blog"

  [params.homeInfoParams]
  Title = "Hi 👋"
  Content = "欢迎来到我的博客，记录生活中的实用指南与旅行见闻。"

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/bates33"

  [params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

  [params.editPost]
  disabled = true

  [params.assets]
  disableFingerprinting = false

[params.cloudflare]
cdnBaseURL = "https://static.bybates.com"

[markup]
  [markup.highlight]
  style = "dracula"
  lineNos = false
  noClasses = false

  [markup.goldmark]
    [markup.goldmark.renderer]
    unsafe = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 30
