<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".post-content p").forEach(function (p) {
    var text = p.textContent.trim();
    if (text.startsWith("⚠️") || text.startsWith("警告")) {
      p.classList.add("warning-tip");
    }
  });

  document.querySelectorAll("a[href]").forEach(function (anchor) {
    var href = anchor.getAttribute("href");
    if (!href || href.charAt(0) === "#" || href.indexOf("mailto:") === 0 || href.indexOf("tel:") === 0) return;
    var url;
    try {
      url = new URL(href, location.href);
    } catch (error) {
      return;
    }
    if (url.protocol !== "http:" && url.protocol !== "https:") return;
    var host = url.hostname.replace(/^www\./, "");
    var internal = host === "localhost" || host === "127.0.0.1" || host === "bybates.com" || host.endsWith(".bybates.com");
    if (internal) {
      anchor.removeAttribute("target");
    } else {
      anchor.setAttribute("target", "_blank");
      anchor.setAttribute("rel", "noopener noreferrer");
    }
  });

  var toc = document.querySelector(".toc");
  if (!toc) return;

  var links = Array.prototype.slice.call(toc.querySelectorAll(".inner > ul > li > a"));
  var pairs = [];
  links.forEach(function (link) {
    var href = link.getAttribute("href") || "";
    if (href.charAt(0) !== "#") return;
    var id = decodeURIComponent(href.slice(1));
    var heading = document.getElementById(id);
    if (heading) pairs.push({ heading: heading, link: link });
  });
  if (!pairs.length || !("IntersectionObserver" in window)) return;

  var current = null;
  function setActive(heading) {
    if (current === heading) return;
    current = heading;
    links.forEach(function (link) {
      link.classList.remove("is-active");
      link.removeAttribute("aria-current");
    });
    var match = pairs.find(function (pair) { return pair.heading === heading; });
    if (!match) return;
    match.link.classList.add("is-active");
    match.link.setAttribute("aria-current", "location");
  }

  var observer = new IntersectionObserver(function (entries) {
    var visible = entries
      .filter(function (entry) { return entry.isIntersecting; })
      .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
    if (visible.length) setActive(visible[0].target);
  }, { rootMargin: "-88px 0px -65% 0px", threshold: [0, 1] });

  pairs.forEach(function (pair) { observer.observe(pair.heading); });

  function markGlass() {
    document.querySelectorAll(".post-content .is-glass").forEach(function (heading) {
      heading.classList.remove("is-glass");
    });
    if (!location.hash) return;
    var heading = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (heading) heading.classList.add("is-glass");
  }

  window.addEventListener("hashchange", markGlass);
  toc.addEventListener("click", function (event) {
    if (event.target.closest("a")) window.setTimeout(markGlass, 0);
  });
  markGlass();
});
</script>
